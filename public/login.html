<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Grand Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏨</text></svg>">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="brand">
            <div class="brand-icon">G</div>
            <div class="brand-text">
                <h2>Grand Hotel</h2>
                <span>Luxury & Hospitality</span>
            </div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html" class="btn-nav">Book Now</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your bookings and view special rates</p>
            </div>

            <!-- 1-Click Demo Accounts -->
            <div class="demo-credentials">
                <div class="demo-title">⚡ Quick Demo Login:</div>
                <div class="demo-btn-group">
                    <button type="button" onclick="fillDemoCredentials('admin@hotel.com', 'Admin@123')" class="btn btn-secondary btn-sm" style="flex:1;">
                        👑 Fill Admin
                    </button>
                    <button type="button" onclick="fillDemoCredentials('guest@hotel.com', 'Guest@123')" class="btn btn-secondary btn-sm" style="flex:1;">
                        👤 Fill Guest
                    </button>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-btn" class="btn btn-block" style="padding: 13px;">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            &copy; 2026 Grand Hotel Management System. All rights reserved.
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Grand Hotel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏨</text></svg>">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="brand">
            <div class="brand-icon">G</div>
            <div class="brand-text">
                <h2>Grand Hotel</h2>
                <span>Luxury & Hospitality</span>
            </div>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html" class="btn-nav">Book Now</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Register to unlock members-only privileges and easy booking</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                    <label for="password">Password (min. 6 characters) *</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" minlength="6" required>
                </div>

                <button type="submit" id="register-btn" class="btn btn-block" style="padding: 13px;">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            &copy; 2026 Grand Hotel Management System. All rights reserved.
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
